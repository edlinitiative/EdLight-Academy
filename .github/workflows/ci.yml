name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      # ESLint (flat config, src/ + api/ + shared/) must pass with 0 errors.
      # Warnings are allowed; errors gate CI.
      - name: Lint web
        run: npm run lint
      # Web tsc is now at zero errors, down from ~242 before the 2026-07
      # type-safety pass and ~117 after it, so this gates as that pass
      # intended. It is not decorative: while non-blocking it silently let a
      # real TS2322 through on api/chat.ts, where refactoring a return value
      # widened a literal union to string.
      #
      # Note this is broader than the api/tsconfig.json check, which did NOT
      # catch that error — run `npx tsc --noEmit` from the root when touching
      # api/, not just the api project.
      - name: Typecheck web
        run: npx tsc --noEmit
      # The jest suite is expected to pass.
      - name: Run web tests
        run: npm test -- --ci
      # A broken production build (webpack + prebuild/postbuild hooks) must
      # fail CI. These build scripts are self-contained (no secrets/network).
      - name: Build web (production)
        run: npm run build

  mobile:
    name: Mobile (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      # ESLint (flat config, eslint-config-expo base) must pass with 0 errors.
      # Warnings are allowed; errors gate CI. React-hooks rules-of-hooks is ERROR.
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint
      - name: Typecheck mobile
        working-directory: mobile
        run: node node_modules/typescript/bin/tsc --noEmit
