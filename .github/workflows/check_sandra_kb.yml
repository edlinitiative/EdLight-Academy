name: Check Sandra KB

# Sandra answers ungrounded when retrieval finds nothing, and does so silently
# — api/chat.ts catches every retrieval failure and carries on. A knowledge
# base that has fallen behind the content is therefore invisible from the
# outside. This job compares the live sandraKb against what current courses,
# quizzes and exams would produce, and fails when they differ.
#
# It was added after a check found 747 chunks missing and 747 orphaned while
# the document totals matched exactly, so nothing looked wrong.
#
# Repair is `npm run kb:sandra` (add --resume to embed only what is missing).

on:
  # Mondays at 04:00 UTC.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  check-kb:
    name: sandraKb matches current content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reads Firestore and public/exams. Writes nothing, and needs no
      # embedding key — the check compares sourceIds, not vectors.
      - name: Check for drift
        run: npm run kb:sandra:check
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
