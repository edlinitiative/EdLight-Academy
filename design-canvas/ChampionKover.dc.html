<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; }
    a { color: #E0532F; } a:hover { color: #ff7a52; }
  </style>
</helmet>

<!-- Cover direction: album-sleeve logic. One enormous piece of artwork, type set
     against it editorially, the win stated like a headline. -->
<div style="width: 1080px; height: 1920px; background: #F4F1EA; position: relative; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column;">

  <svg viewBox="0 0 1080 1180" width="1080" height="1180" style="position: absolute; top: 0; left: 0;">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0857A6"/><stop offset="58%" stop-color="#1B6FE0"/><stop offset="100%" stop-color="#E0532F"/>
      </linearGradient>
      <pattern id="lines" width="1080" height="9" patternUnits="userSpaceOnUse">
        <rect width="1080" height="4.5" fill="#000000" opacity=".07"/>
      </pattern>
    </defs>
    <rect width="1080" height="1180" fill="url(#sky)"/>
    <!-- concentric rings: the logo's rays abstracted into a rising sun -->
    <g fill="none" stroke="#F4F1EA" stroke-width="2.5" opacity=".42">
      <circle cx="540" cy="880" r="180"/><circle cx="540" cy="880" r="300"/>
      <circle cx="540" cy="880" r="420"/><circle cx="540" cy="880" r="540"/>
      <circle cx="540" cy="880" r="660"/>
    </g>
    <circle cx="540" cy="880" r="118" fill="#F4F1EA"/>
    <rect width="1080" height="1180" fill="url(#lines)"/>
  </svg>

  <div style="position: relative; padding: 76px 76px 0; display: flex; align-items: center; gap: 18px;">
    <svg width="56" height="56" viewBox="0 0 100 100" fill="none" stroke="#F4F1EA" stroke-width="5" stroke-linecap="round">
      <line x1="50" y1="10" x2="50" y2="25"/><line x1="50" y1="75" x2="50" y2="90"/>
      <line x1="10" y1="50" x2="25" y2="50"/><line x1="75" y1="50" x2="90" y2="50"/>
      <line x1="21" y1="21" x2="32" y2="32"/><line x1="68" y1="68" x2="79" y2="79"/>
      <line x1="21" y1="79" x2="32" y2="68"/><line x1="68" y1="32" x2="79" y2="21"/>
      <circle cx="50" cy="50" r="18"/>
    </svg>
    <span style="font-size: 22px; font-weight: 800; letter-spacing: 5px; color: #F4F1EA;">EDLIGHT ACADEMY</span>
    <span style="margin-left: auto; font-size: 22px; font-weight: 700; letter-spacing: 3px; color: rgba(244,241,234,.72);">S38 / 2026</span>
  </div>

  <!-- Headline overlapping the artwork edge, album-sleeve style -->
  <div style="position: relative; margin-top: 690px; padding: 0 76px;">
    <span style="display: inline-block; background: #E0532F; color: #F4F1EA; font-size: 26px; font-weight: 800; letter-spacing: 5px; padding: 12px 22px;">CHAMPIONNE</span>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 156px; line-height: .90; letter-spacing: -5px; color: #14171F; margin-top: 30px;">
      Wendy<br>Jean-<br>Baptiste
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; padding: 0 76px; display: flex; flex-direction: column; justify-content: flex-end; gap: 34px; padding-bottom: 76px;">
    <div style="display: flex; align-items: flex-end; gap: 40px; border-top: 3px solid #14171F; padding-top: 26px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #8A8377;">SCORE</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 88px; line-height: 1; color: #14171F; letter-spacing: -2px;">2 456</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #8A8377;">RANG</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 88px; line-height: 1; color: #14171F; letter-spacing: -2px;">N°1</span>
      </div>
      <div style="margin-left: auto; display: flex; flex-direction: column; gap: 4px; text-align: right;">
        <span style="font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #8A8377;">CODE</span>
        <span style="font-size: 44px; font-weight: 800; color: #E0532F; letter-spacing: 2px;">TED4X2</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 40px; color: #14171F;">Essaie de me détrôner.</span>
      <div style="margin-left: auto; display: flex; flex-direction: column; text-align: right; gap: 2px;">
        <span style="font-size: 23px; font-weight: 600; color: #6B6559;">academy.edlight.org</span>
        <span style="font-size: 23px; font-weight: 800; color: #14171F;">@edlightacademy</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
