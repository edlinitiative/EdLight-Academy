<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; }
    a { color: #1B6FE0; } a:hover { color: #0857A6; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    .lift { animation: riseIn .5s cubic-bezier(.16,1,.3,1) both; }
    .grain { position: absolute; inset: 0; pointer-events: none; opacity: .30; mix-blend-mode: multiply; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFAF8; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Subject artwork: a hexagonal lattice, drawn large and faint. Chemistry has
       its own visual language; using it as ground beats a generic icon. -->
  <svg viewBox="0 0 390 300" width="390" height="300" style="position: absolute; top: -40px; right: -70px; opacity: .10;">
    <g fill="none" stroke="#1B6FE0" stroke-width="1.4">
      <polygon points="200,40 232,58 232,94 200,112 168,94 168,58"/>
      <polygon points="264,40 296,58 296,94 264,112 232,94 232,58"/>
      <polygon points="232,94 264,112 264,148 232,166 200,148 200,112"/>
      <polygon points="296,94 328,112 328,148 296,166 264,148 264,112"/>
      <polygon points="264,148 296,166 296,202 264,220 232,202 232,166"/>
    </g>
    <g fill="#1B6FE0">
      <circle cx="232" cy="58" r="3.5"/><circle cx="296" cy="94" r="3.5"/>
      <circle cx="264" cy="148" r="3.5"/><circle cx="232" cy="166" r="3.5"/>
    </g>
  </svg>
  <svg class="grain"><filter id="n1"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n1)" opacity=".22"/></svg>

  <div style="position: relative; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14171F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #9AA3AF;">Chimie · NS1</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; color: #14171F; letter-spacing: .1px;">Les composés du carbone</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 3px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #14171F; line-height: 1;">04</span>
        <span style="font-size: 12px; font-weight: 600; color: #9AA3AF;">/10</span>
      </div>
    </div>

    <!-- Segmented progress: each question is its own mark, so progress is countable -->
    <div style="display: flex; gap: 4px;">
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #14171F;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #14171F;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #14171F;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #1B6FE0;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
      <div style="flex-grow: 1; height: 3px; border-radius: 99px; background: #E4E0D9;"></div>
    </div>
  </div>

  <div style="position: relative; padding: 34px 24px 0; display: flex; flex-direction: column; gap: 28px; flex-grow: 1;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 32px; color: #14171F; line-height: 37px; letter-spacing: -.2px; text-wrap: pretty;">
      Quelle est la formule chimique du dioxyde de carbone&nbsp;?
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div class="lift" style="animation-delay:.04s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(20,23,31,.05), 0 8px 24px -12px rgba(20,23,31,.16); border: .5px solid rgba(20,23,31,.06);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #B6AFA4;">a</span>
        <span style="font-size: 16px; color: #14171F; font-weight: 500;">CO</span>
      </div>

      <div class="lift" style="animation-delay:.11s; position: relative; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: #14171F; box-shadow: 0 2px 4px rgba(20,23,31,.10), 0 16px 32px -14px rgba(20,23,31,.45); overflow: hidden;">
        <div style="position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 55%);"></div>
        <span style="position: relative; font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: rgba(255,255,255,.45);">b</span>
        <span style="position: relative; font-size: 16px; color: #ffffff; font-weight: 700;">CO₂</span>
        <span style="position: relative; margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8FD4FF;">+10 XP</span>
      </div>

      <div class="lift" style="animation-delay:.18s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(20,23,31,.05), 0 8px 24px -12px rgba(20,23,31,.16); border: .5px solid rgba(20,23,31,.06);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #B6AFA4;">c</span>
        <span style="font-size: 16px; color: #14171F; font-weight: 500;">C₂O</span>
      </div>

      <div class="lift" style="animation-delay:.25s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: #ffffff; box-shadow: 0 1px 2px rgba(20,23,31,.05), 0 8px 24px -12px rgba(20,23,31,.16); border: .5px solid rgba(20,23,31,.06);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: #B6AFA4;">d</span>
        <span style="font-size: 16px; color: #14171F; font-weight: 500;">CaCO₃</span>
      </div>
    </div>
  </div>

  <div style="position: relative; padding: 0 24px 30px; display: flex; align-items: center; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #9AA3AF;">Série</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; color: #14171F; line-height: 1;">3 jours</span>
    </div>
    <div style="margin-left: auto; height: 54px; padding: 0 26px; border-radius: 99px; background: #1B6FE0; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 28px -10px rgba(27,111,224,.75);">
      <span style="font-size: 15px; font-weight: 700; color: #ffffff; letter-spacing: -.1px;">Continuer</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
