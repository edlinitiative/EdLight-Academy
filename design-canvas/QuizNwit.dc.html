<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; }
    a { color: #8FD4FF; } a:hover { color: #b9e5ff; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-16px,18px) scale(1.06); } }
    .lift { animation: riseIn .55s cubic-bezier(.16,1,.3,1) both; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #080A11; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Gradient mesh + grain: depth comes from layered light, not from borders -->
  <div style="position: absolute; top: -170px; left: -120px; width: 460px; height: 460px; border-radius: 999px; background: radial-gradient(circle, rgba(46,134,240,.50) 0%, rgba(46,134,240,0) 68%); filter: blur(6px); animation: drift 14s ease-in-out infinite;"></div>
  <div style="position: absolute; top: 300px; right: -180px; width: 420px; height: 420px; border-radius: 999px; background: radial-gradient(circle, rgba(143,90,240,.34) 0%, rgba(143,90,240,0) 68%); filter: blur(6px); animation: drift 18s ease-in-out infinite reverse;"></div>
  <div style="position: absolute; bottom: -200px; left: 40px; width: 380px; height: 380px; border-radius: 999px; background: radial-gradient(circle, rgba(224,83,47,.24) 0%, rgba(224,83,47,0) 70%); filter: blur(8px);"></div>
  <svg style="position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay;"><filter id="n2"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4"/></filter><rect width="100%" height="100%" filter="url(#n2)"/></svg>

  <div style="position: relative; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.72)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.42);">Chimie · NS1</span>
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; color: #ffffff;">Les composés du carbone</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 3px;">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; color: #ffffff; line-height: 1;">04</span>
        <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,.42);">/10</span>
      </div>
    </div>
    <div style="display: flex; gap: 4px;">
      <div style="flex-grow:1;height:3px;border-radius:99px;background:#8FD4FF;"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:#8FD4FF;"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:#8FD4FF;"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:#8FD4FF;"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
      <div style="flex-grow:1;height:3px;border-radius:99px;background:rgba(255,255,255,.14);"></div>
    </div>
  </div>

  <div style="position: relative; padding: 36px 24px 0; display: flex; flex-direction: column; gap: 30px; flex-grow: 1;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; color: #ffffff; line-height: 39px; letter-spacing: -.3px; text-wrap: pretty;">
      Quelle est la formule chimique du dioxyde de carbone&nbsp;?
    </div>

    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div class="lift" style="animation-delay:.04s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: rgba(255,255,255,.045); border-top: 1px solid rgba(255,255,255,.10); border-bottom: 1px solid rgba(0,0,0,.25);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: rgba(255,255,255,.38);">a</span>
        <span style="font-size: 16px; color: rgba(255,255,255,.92); font-weight: 500;">CO</span>
      </div>

      <div class="lift" style="animation-delay:.11s; position: relative; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: linear-gradient(135deg, rgba(143,212,255,.20), rgba(46,134,240,.12)); border-top: 1px solid rgba(143,212,255,.45); border-bottom: 1px solid rgba(0,0,0,.25); box-shadow: 0 0 40px -8px rgba(143,212,255,.40);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: rgba(143,212,255,.75);">b</span>
        <span style="font-size: 16px; color: #ffffff; font-weight: 700;">CO₂</span>
        <span style="margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8FD4FF;">+10 XP</span>
      </div>

      <div class="lift" style="animation-delay:.18s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: rgba(255,255,255,.045); border-top: 1px solid rgba(255,255,255,.10); border-bottom: 1px solid rgba(0,0,0,.25);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: rgba(255,255,255,.38);">c</span>
        <span style="font-size: 16px; color: rgba(255,255,255,.92); font-weight: 500;">C₂O</span>
      </div>

      <div class="lift" style="animation-delay:.25s; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 18px; border-radius: 16px; background: rgba(255,255,255,.045); border-top: 1px solid rgba(255,255,255,.10); border-bottom: 1px solid rgba(0,0,0,.25);">
        <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; color: rgba(255,255,255,.38);">d</span>
        <span style="font-size: 16px; color: rgba(255,255,255,.92); font-weight: 500;">CaCO₃</span>
      </div>
    </div>
  </div>

  <div style="position: relative; padding: 0 24px 30px; display: flex; align-items: center; gap: 14px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,.42);">Série</span>
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; color: #ffffff; line-height: 1;">3 jours</span>
    </div>
    <div style="margin-left: auto; height: 54px; padding: 0 26px; border-radius: 99px; background: linear-gradient(135deg, #ffffff, #D8E8FF); display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 34px -10px rgba(143,212,255,.55);">
      <span style="font-size: 15px; font-weight: 700; color: #080A11; letter-spacing: -.1px;">Continuer</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#080A11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
